[project]
name = "cloudie"
version = "0.2.0"
description = "Cloudie: tropical cyclone intensity estimation from satellite imagery. Not a warning system."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "imbalanced-learn>=0.12",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "torchvision>=0.16",
  "h5py>=3.9",
  "streamlit>=1.33",
  "xgboost>=2.0",
  "scipy>=1.10",
]
test = [
  "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "cloudie*", "scripts*", "space*", "incyde*"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
