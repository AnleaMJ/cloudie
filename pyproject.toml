[project]
name = "cloudie"
version = "0.1.0"
description = "Cloudie: tropical cyclone intensity estimation from satellite imagery. Not a warning system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16", "matplotlib>=3.7", "h5py>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
