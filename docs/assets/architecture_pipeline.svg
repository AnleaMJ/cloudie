<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --branch-a-accent: #0284c7;
        --branch-a-bg: #f0f9ff;
        --branch-a-border: #bae6fd;
        --branch-b-accent: #6366f1;
        --branch-b-bg: #eef2ff;
        --branch-b-border: #c7d2fe;
        --calib-accent: #0d9488;
        --calib-bg: #f0fdfa;
        --calib-border: #99f6e4;
        --leak-accent: #e11d48;
        --leak-bg: #fff1f2;
        --leak-border: #fecdd3;
        --arrow-color: #94a3b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0b0f17;
          --card-bg: #151d2a;
          --card-border: #233044;
          --text-primary: #f1f5f9;
          --text-secondary: #cbd5e1;
          --text-muted: #94a3b8;
          --branch-a-accent: #38bdf8;
          --branch-a-bg: #0c2135;
          --branch-a-border: #0369a1;
          --branch-b-accent: #818cf8;
          --branch-b-bg: #191e38;
          --branch-b-border: #4338ca;
          --calib-accent: #2dd4bf;
          --calib-bg: #082925;
          --calib-border: #0f766e;
          --leak-accent: #fb7185;
          --leak-bg: #2d1218;
          --leak-border: #9f1239;
          --arrow-color: #475569;
        }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .title { font-size: 24px; font-weight: 700; fill: var(--text-primary); }
      .subtitle { font-size: 13px; font-weight: 400; fill: var(--text-muted); }
      .section-hdr { font-size: 15px; font-weight: 700; }
      .card-title { font-size: 13px; font-weight: 600; fill: var(--text-primary); }
      .card-body { font-size: 11px; fill: var(--text-secondary); line-height: 1.4; }
      .tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--arrow-color)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--branch-a-accent)"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--branch-b-accent)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="var(--bg-color)"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text class="title" x="0" y="0">Cloudie Dual-Branch Research Architecture</text>
    <text class="subtitle" x="0" y="24">Tropical Cyclone Maximum Sustained Wind Regression (IMD 3-min) &amp; Uncertainty Estimation</text>
    <rect x="850" y="-12" width="340" height="34" rx="6" fill="var(--leak-bg)" stroke="var(--leak-border)" stroke-width="1"/>
    <text x="862" y="10" fill="var(--leak-accent)" font-size="11" font-weight="600">6-Point Leakage Audit: Disjoint Storm Folds Only</text>
  </g>

  <!-- Data Preprocessing & Splitting Box (Input Stage) -->
  <g transform="translate(50, 95)">
    <rect width="1180" height="95" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
    <text class="section-hdr" x="20" y="28" fill="var(--text-primary)">Canonical Data Pipeline (src/schema.py, src/splits.py, src/preprocessing.py)</text>
    
    <g transform="translate(20, 42)">
      <!-- Step 1 -->
      <rect width="260" height="42" rx="5" fill="var(--bg-color)" stroke="var(--card-border)"/>
      <text class="card-title" x="12" y="18">1. Raw Multi-Basin Satellite IR</text>
      <text class="card-body" x="12" y="32">INCYDE (INSAT-3D/R) / TCIR (IR1) / NASA</text>

      <!-- Arrow -->
      <line x1="265" y1="21" x2="285" y2="21" stroke="var(--arrow-color)" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <g transform="translate(290, 0)">
        <rect width="260" height="42" rx="5" fill="var(--bg-color)" stroke="var(--card-border)"/>
        <text class="card-title" x="12" y="18">2. Leak-Free Grouped Splits</text>
        <text class="card-body" x="12" y="32">Storm-wise / Chronological / Basin Holdout</text>
      </g>

      <!-- Arrow -->
      <line x1="555" y1="21" x2="575" y2="21" stroke="var(--arrow-color)" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 3 -->
      <g transform="translate(580, 0)">
        <rect width="270" height="42" rx="5" fill="var(--bg-color)" stroke="var(--card-border)"/>
        <text class="card-title" x="12" y="18">3. Train-Only Stats &amp; Normalization</text>
        <text class="card-body" x="12" y="32">Finite pixel z-score fit strictly on Train storms</text>
      </g>

      <!-- Arrow -->
      <line x1="855" y1="21" x2="875" y2="21" stroke="var(--arrow-color)" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4 -->
      <g transform="translate(880, 0)">
        <rect width="260" height="42" rx="5" fill="var(--bg-color)" stroke="var(--card-border)"/>
        <text class="card-title" x="12" y="18">4. Observation &amp; Link Guardrails</text>
        <text class="card-body" x="12" y="32">Cross-split temporal links nulled (LeakageError)</text>
      </g>
    </g>
  </g>

  <!-- Split Fork Connectors -->
  <path d="M 320 190 L 320 235 L 80 235 L 80 260" fill="none" stroke="var(--branch-a-accent)" stroke-width="2" marker-end="url(#arrow-a)"/>
  <path d="M 960 190 L 960 235 L 1200 235 L 1200 260" fill="none" stroke="var(--branch-b-accent)" stroke-width="2" marker-end="url(#arrow-b)"/>

  <!-- ==================== BRANCH A: Classical Baselines ==================== -->
  <g transform="translate(50, 260)">
    <!-- Container -->
    <rect width="575" height="530" rx="10" fill="var(--branch-a-bg)" stroke="var(--branch-a-border)" stroke-width="1.5"/>
    
    <text class="tag" x="24" y="32" fill="var(--branch-a-accent)">Branch A &bull; Classical Machine Learning</text>
    <text class="section-hdr" x="24" y="52" fill="var(--text-primary)">Physics-Motivated Features &amp; Baselines (src/features.py, src/baselines.py)</text>

    <!-- Sub-box 1: Native Crop -->
    <g transform="translate(24, 70)">
      <rect width="527" height="45" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="20">Native Image Crop (Preserve Spatial Structure)</text>
      <text class="card-body" x="14" y="36">No forced square downsampling; storm assumed near center</text>
    </g>

    <!-- Sub-box 2: Extracted Features -->
    <g transform="translate(24, 128)">
      <rect width="527" height="150" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="22">Domain-Specific Physical Feature Extraction</text>
      <circle cx="22" cy="44" r="3" fill="var(--branch-a-accent)"/>
      <text class="card-body" x="32" y="48"><tspan font-weight="600">Pixel Statistics:</tspan> Mean, std, cold-pixel fractions (&lt; 200, 210, 220, 230, 240 K)</text>
      
      <circle cx="22" cy="68" r="3" fill="var(--branch-a-accent)"/>
      <text class="card-body" x="32" y="72"><tspan font-weight="600">Structural Profiles:</tspan> 8 concentric radial bins, warm-eye contrast, eyewall contrast</text>
      
      <circle cx="22" cy="92" r="3" fill="var(--branch-a-accent)"/>
      <text class="card-body" x="32" y="96"><tspan font-weight="600">Simplified DAV (Deviation Angle Variance):</tspan> Circular variance at 4 radial fractions</text>
      
      <circle cx="22" cy="116" r="3" fill="var(--branch-a-accent)"/>
      <text class="card-body" x="32" y="120"><tspan font-weight="600">Texture &amp; Wavelets:</tspan> 16-level GLCM (contrast, energy, homg), Haar wavelet energy</text>

      <circle cx="22" cy="138" r="3" fill="var(--branch-a-accent)"/>
      <text class="card-body" x="32" y="142"><tspan font-weight="600">Temporal Deltas:</tspan> Within-storm previous frame delta (null cross-split)</text>
    </g>

    <!-- Sub-box 3: Selection -->
    <g transform="translate(24, 290)">
      <rect width="527" height="50" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="20">Train-Storm Only Feature Selection</text>
      <text class="card-body" x="14" y="36">Correlation filter (threshold 0.95) + Random Forest importance (top 25 features)</text>
    </g>

    <!-- Sub-box 4: Models & Cross-Validation -->
    <g transform="translate(24, 352)">
      <rect width="527" height="85" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="22">Model Zoo &amp; Stratified Group K-Fold</text>
      <text class="card-body" x="14" y="40">&bull; <tspan font-weight="600">Regression:</tspan> Mean, Persistence (Ref), Ridge, Linear Regression, KNN, SVR, RF, XGBoost</text>
      <text class="card-body" x="14" y="58">&bull; <tspan font-weight="600">Classification:</tspan> 5 project bins (D_DD, CS, SCS, VSCS, ESCS_SUCS) with inner-fold SMOTE</text>
      <text class="card-body" x="14" y="74">&bull; <tspan font-weight="600">Validation:</tspan> StratifiedGroupKFold on train storms; zero test-leakage</text>
    </g>

    <!-- Sub-box 5: Evaluation -->
    <g transform="translate(24, 448)">
      <rect width="527" height="65" rx="6" fill="var(--card-bg)" stroke="var(--branch-a-accent)" stroke-width="1.2"/>
      <text class="card-title" x="14" y="20" fill="var(--branch-a-accent)">Held-Out Storm Evaluation (src/evaluate.py)</text>
      <text class="card-body" x="14" y="36">RMSE, MAE, Bias overall &amp; per-class with 95% Percentile Bootstrap (resampling storm IDs)</text>
      <text class="card-body" x="14" y="52">Classes with n_storms &lt; 3 strictly tagged "indicative (n_storms&lt;3)"</text>
    </g>
  </g>

  <!-- ==================== BRANCH B: Deep Learning ==================== -->
  <g transform="translate(655, 260)">
    <!-- Container -->
    <rect width="575" height="530" rx="10" fill="var(--branch-b-bg)" stroke="var(--branch-b-border)" stroke-width="1.5"/>
    
    <text class="tag" x="24" y="32" fill="var(--branch-b-accent)">Branch B &bull; Deep Spatiotemporal Network</text>
    <text class="section-hdr" x="24" y="52" fill="var(--text-primary)">4-Frame ConvLSTM &amp; Post-Hoc Calibration (src/model.py, src/calibration.py)</text>

    <!-- Sub-box 1: Sequence Stacking -->
    <g transform="translate(24, 70)">
      <rect width="527" height="45" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="20">Temporal Input Window: (B &times; 4 &times; 1 &times; 96 &times; 96)</text>
      <text class="card-body" x="14" y="36">4 sequential hourly/sub-daily frames; median letterbox resize; inscribed circle mask</text>
    </g>

    <!-- Sub-box 2: Architecture & Heads -->
    <g transform="translate(24, 128)">
      <rect width="527" height="110" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="22">Deep Sequence Backbone &amp; Multi-Task Heads</text>
      <text class="card-body" x="14" y="42">&bull; <tspan font-weight="600">Backbone:</tspan> ConvLSTM (hidden=16) / SimpleCNN / ResNet18</text>
      <text class="card-body" x="14" y="60">&bull; <tspan font-weight="600">Wind Head (Primary):</tspan> Linear &rarr; Wind speed in knots (Smooth L1 Loss)</text>
      <text class="card-body" x="14" y="78">&bull; <tspan font-weight="600">Category Head (Aux):</tspan> Linear &rarr; 5 class logits (Cross-Entropy Loss)</text>
      <text class="card-body" x="14" y="96">&bull; <tspan font-weight="600">Loss Weighting:</tspan> L = SmoothL1(wind) + &lambda;_cls &times; CE(class) &plus; inverse-freq weights</text>
    </g>

    <!-- Sub-box 3: MC Dropout -->
    <g transform="translate(24, 250)">
      <rect width="527" height="70" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
      <text class="card-title" x="14" y="20">Uncertainty Estimation: Monte Carlo Dropout</text>
      <text class="card-body" x="14" y="36">20 stochastic forward passes at inference with dropout active (p=0.3)</text>
      <text class="card-body" x="14" y="52">Yields predictive mean &mu; and dropout epistemic standard deviation &sigma;_dropout</text>
    </g>

    <!-- Sub-box 4: Conformal Calibration (Highlight Box) -->
    <g transform="translate(24, 332)">
      <rect width="527" height="180" rx="6" fill="var(--calib-bg)" stroke="var(--calib-border)" stroke-width="1.5"/>
      <text class="tag" x="14" y="22" fill="var(--calib-accent)">Post-Hoc Conformal Calibration &bull; Torch-Free (src/calibration.py)</text>
      <text class="card-title" x="14" y="42" fill="var(--text-primary)">Validation-Fit Scaled Conformal Prediction</text>
      
      <circle cx="22" cy="64" r="3" fill="var(--calib-accent)"/>
      <text class="card-body" x="32" y="68"><tspan font-weight="600">Conformal Scaling:</tspan> Global scaling factor s fit on validation conformity scores (|y - &mu;| / hw)</text>

      <circle cx="22" cy="88" r="3" fill="var(--calib-accent)"/>
      <text class="card-body" x="32" y="92"><tspan font-weight="600">Empirical Coverage &amp; Width:</tspan> Evaluated at 50%, 80%, 90%, 95% nominal levels</text>

      <circle cx="22" cy="112" r="3" fill="var(--calib-accent)"/>
      <text class="card-body" x="32" y="116"><tspan font-weight="600">MACE (Mean Absolute Calibration Error):</tspan> Mean gap across 10 nominal coverage bins</text>

      <circle cx="22" cy="136" r="3" fill="var(--calib-accent)"/>
      <text class="card-body" x="32" y="140"><tspan font-weight="600">ENCE (Expected Normalized Calibration Error):</tspan> Bin-wise relative error of predicted std vs RMSE</text>

      <circle cx="22" cy="160" r="3" fill="var(--calib-accent)"/>
      <text class="card-body" x="32" y="164"><tspan font-weight="600">Spearman Rank Correlation (&rho;):</tspan> Monotonicity between predicted uncertainty and |residual|</text>
    </g>
  </g>
</svg>
