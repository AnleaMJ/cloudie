project:
  name: cyclone-intensity-estimation-smoke
  seed: 7
  honesty: >
    Smoke images are synthetic. Metrics from this config are a software
    check, not a scientific result and not a forecast.
paths:
  manifest: data/smoke/manifest.csv
  artifacts: artifacts/smoke
  reports: reports/smoke
data:
  image_size: 64
  channels: 1
  normalize: zscore
  max_missing_fraction: 0.30
  plausible_wind_kt: [0, 200]
  # Project grouping for metrics. Not official IMD classes and not a warning.
  imd5_edges_kt: [17, 34, 48, 64, 91]
  imd5_names: [D_DD, CS, SCS, VSCS, ESCS_SUCS]
split:
  strategy: storm_wise
  test_fraction: 0.2
  val_fraction: 0.2
  holdout_years: [2021]
  holdout_basin: NIO
  seed: 7
model:
  name: simple_cnn
  pretrained: false
  dropout: 0.3
  mc_samples: 20
  n_frames: 4
  hidden: 8
train:
  batch_size: 8
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  patience: 1
  class_loss_weight: 0.1
  size_loss_weight: 0.1
predict:
  advisory_jump_kt: 20
features:
  calibrated: false
  cold_thresholds: [200, 210, 220, 230, 240]
  radial_bins: 8
  eye_radius_fraction: 0.12
  cdo_outer_fraction: 0.35
  eye_contrast_min: 2.0
  dav_radii_fractions: [0.15, 0.30, 0.45, 0.60]
  dav_annulus_width_fraction: 0.08
  glcm_levels: 16
  glcm_distance: 1
  selection:
    correlation_threshold: 0.95
    max_features: 25
    method: correlation_rf
    n_estimators: 20
    seed: 7
baselines:
  n_splits: 2
  seed: 7
  regression_models: [mean, ridge, knn, svr, rf, xgboost]
  classification_models: [most_frequent, logreg, knn, svc, rf, xgboost]
  use_smote: true
  ridge_alpha: 1.0
  knn_neighbors: 3
  svr_c: 1.0
  svc_c: 1.0
  rf_estimators: 20
  rf_max_depth: 4
  xgb_estimators: 20
  xgb_max_depth: 3
  xgb_learning_rate: 0.1
  max_iter: 400
forbidden_features:
  - wind_speed_kt
  - r34_nmi
  - rmw_nmi
  - imd5_class
  - intensity_bin
