project:
  name: cloudie
  seed: 7
paths:
  manifest: data/smoke/manifest.csv
  artifacts: artifacts/smoke
  reports: reports/smoke
data:
  image_size: 64
  channels: 1
  normalize: zscore
  max_missing_fraction: 0.30
  plausible_wind_kt: [0, 200]
  # Same project bins as config.yaml. 90 kt maps to VSCS.
  imd5_edges_kt: [17, 34, 48, 64, 91]
  imd5_names: [D_DD, CS, SCS, VSCS, ESCS_SUCS]
split:
  strategy: storm_wise
  test_fraction: 0.25
  val_fraction: 0.25
  holdout_years: [2021]
  holdout_basin: NIO
  seed: 7
model:
  name: simple_cnn
  pretrained: false
  dropout: 0.3
  mc_samples: 4
forbidden_features:
  - wind_speed_kt
  - r34_nmi
  - rmw_nmi
  - imd5_class
  - intensity_bin
